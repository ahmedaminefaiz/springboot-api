name: CI/CD Spring Boot → Railway

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # ──────────────────────────────────────────
  # JOB 1 — CI : test + build Docker
  # ──────────────────────────────────────────
  ci:
    name: 🧪 Test → 📦 Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 🧪 Run tests
        run: mvn test

      - name: 📦 Build Docker image
        run: docker build -t springboot-app .

  # ──────────────────────────────────────────
  # JOB 2 — CD : deploy sur Railway
  # ──────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Railway
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy via Railway CLI
        run: |
          # Railway détecte le Dockerfile et déploie automatiquement
          echo "Push sur main déclenche Railway deployment"
    
