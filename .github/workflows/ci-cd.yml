name: CI/CD Spring Boot → Railway

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  ci:
    name: 🧪 Test + Build
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ☕ Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # - name: 🧪 Run tests
      #   run: mvn clean test

      - name: 📦 Build jar
        run: mvn clean package -DskipTests

  deploy-dev:
    name: 🚀 Deploy DEV
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - name: 🚀 Deploy develop
        run: echo "Deploy DEV Railway service"

  deploy-prod:
    name: 🚀 Deploy PROD
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 🚀 Deploy main
        run: echo "Deploy PROD Railway service"
