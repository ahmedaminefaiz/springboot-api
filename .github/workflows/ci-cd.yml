name: CI/CD Spring Boot → Railway

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  ci:
    name: 🧪 Test + Build
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ☕ Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 🧪 Run tests
        run: mvn clean test

      - name: 📦 Build jar
        run: mvn clean package -DskipTests

  docker:
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@v4

      # 🔐 Login Docker Hub
      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 🟢 DEV
      - name: Build & Push DEV
        if: github.ref == 'refs/heads/develop'
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/spring-app:dev .
          docker push ${{ secrets.DOCKER_USERNAME }}/spring-app:dev
          
       # 🚀 Deploy DEV
      - name: Trigger DEV Deployment
        if: github.ref == 'refs/heads/develop'
        run: |
          curl -X POST "${{ secrets.DEPLOY_WEBHOOK_DEV }}" 

      # 🔴 PROD
      - name: Build & Push PROD
        if: github.ref == 'refs/heads/main'
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/spring-app:prod .
          docker push ${{ secrets.DOCKER_USERNAME }}/spring-app:prod
     

       # 🚀 Deploy PROD
      - name: Trigger PROD Deployment
        if: github.ref == 'refs/heads/main'
        run: |
          curl -X POST "${{ secrets.DEPLOY_WEBHOOK_PROD }}"
