spring.application.name=demo
server.port=${PORT:8080}

spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=120000
spring.datasource.hikari.connection-init-sql=SELECT 1


server.servlet.context-path=/api

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

whatsapp.api.url=https://graph.facebook.com/v25.0
whatsapp.phone.number.id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.access.token=${WHATSAPP_ACCESS_TOKEN}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.sender.name=${MAIL_SENDER_NAME:UrbanAlert}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

similarity.url=${SIMILARITY_URL:http://localhost:8000}

# KPI dashboard cache TTL (minutes)
kpi.cache.ttl-minutes=${KPI_CACHE_TTL_MINUTES:5}
